<!-- DSML Snippet: Custom Accessible Form Fields -->
<div class="space-y-6 max-w-lg">
  <!-- Styled Select Dropdown -->
  <div>
    <label for="consulat-select" class="block text-xs font-bold text-[var(--ml-color-neutral-800)] uppercase tracking-wider mb-2">
      Consulat de rattachement <span class="text-red-500">*</span>
    </label>
    <select id="consulat-select" class="w-full px-3 py-2.5 bg-white border border-[var(--ml-color-neutral-300)] rounded-lg text-sm text-[var(--ml-color-neutral-900)] focus:outline-none focus:ring-2 focus:ring-[var(--ml-color-green-600)] focus:border-transparent">
      <option value="">Sélectionnez votre consulat...</option>
      <option value="paris">Ambassade de France (Paris)</option>
      <option value="lyon">Consulat Général de Lyon</option>
      <option value="bamako">District de Bamako</option>
    </select>
  </div>

  <!-- File Upload Area -->
  <div>
    <label class="block text-xs font-bold text-[var(--ml-color-neutral-800)] uppercase tracking-wider mb-2">
      Pièce d'identité (PDF ou JPG, max 5 Mo)
    </label>
    <div class="flex justify-center px-6 pt-5 pb-6 border-2 border-dashed border-[var(--ml-color-neutral-300)] rounded-lg bg-[var(--ml-color-neutral-50)] hover:bg-white transition cursor-pointer">
      <div class="space-y-1 text-center">
        <svg class="mx-auto h-10 w-10 text-[var(--ml-color-neutral-400)]" stroke="currentColor" fill="none" viewBox="0 0 48 48">
          <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h24a4 4 0 004-4V20L28 8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="flex text-xs text-[var(--ml-color-neutral-600)]">
          <span class="font-bold text-[var(--ml-color-green-700)] hover:text-[var(--ml-color-green-800)]">Téléverser un fichier</span>
          <p class="pl-1">ou glisser-déposer</p>
        </div>
      </div>
    </div>
  </div>
</div>
