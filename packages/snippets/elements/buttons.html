<!-- DSML Snippet: Primary Button -->
<button type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-white bg-[var(--ml-color-green-500)] hover:bg-[var(--ml-color-green-600)] focus:outline-none focus:ring-2 focus:ring-[var(--ml-color-green-400)] focus:ring-offset-2 rounded-lg transition-colors shadow-sm">
  <span>Action Principale</span>
</button>

<!-- DSML Snippet: Secondary Button -->
<button type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-[var(--ml-color-neutral-800)] bg-[var(--ml-color-neutral-100)] hover:bg-[var(--ml-color-neutral-200)] focus:outline-none focus:ring-2 focus:ring-[var(--ml-color-neutral-400)] focus:ring-offset-2 rounded-lg transition-colors border border-[var(--ml-color-neutral-300)]">
  <span>Action Secondaire</span>
</button>

<!-- DSML Snippet: Gold Accent Button -->
<button type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold text-[var(--ml-color-neutral-900)] bg-[var(--ml-color-gold-400)] hover:bg-[var(--ml-color-gold-500)] focus:outline-none focus:ring-2 focus:ring-[var(--ml-color-gold-300)] focus:ring-offset-2 rounded-lg transition-colors shadow-sm">
  <span>Accès Privilégié</span>
</button>

<!-- DSML Snippet: Danger Button -->
<button type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-white bg-[var(--ml-color-red-600)] hover:bg-[var(--ml-color-red-700)] focus:outline-none focus:ring-2 focus:ring-[var(--ml-color-red-400)] focus:ring-offset-2 rounded-lg transition-colors shadow-sm">
  <span>Supprimer</span>
</button>
